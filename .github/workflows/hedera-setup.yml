name: Hedera setup

# Creates Ordo's Hedera testnet resources with the operator key held in the `hedera-testnet` environment.
# List what to create in .github/deploy/hedera.request, one per line, and push it:
#   topic      the HCS topic the ledger is anchored to             → HEDERA_TOPIC_ID
#   contracts  OrdoWorkOrders and OrdoPolicies, bound to OrdoTrust  → TRUST_WORKORDERS_ADDRESS, TRUST_POLICIES_ADDRESS
#   passport   the HTS NFT collection for lot passports             → HEDERA_PASSPORT_TOKEN_ID
#   agent      the maintenance agent's own Hedera account           → HEDERA_AGENT_ID; its key goes straight to Vercel
#              (needs VERCEL_TOKEN as a repository secret, and is never printed)
#   stablecoin Ordo USD, made with Stablecoin Studio's SDK and factory  → STABLECOIN_ADDRESS, STABLECOIN_TOKEN_ADDRESS
#   payonproof OrdoPayOnProof, bound to Ordo USD and OrdoTrust         → PAY_ON_PROOF_ADDRESS
#              (stablecoin and payonproof write their values to Vercel; payonproof uses the stablecoin from the
#              same run, or the STABLECOIN_ADDRESS / STABLECOIN_TOKEN_ADDRESS repository variables)
# The log and summary show only public values.
on:
  push:
    paths: [".github/deploy/hedera.request"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: hedera-testnet
    env:
      HEDERA_OPERATOR_ID: ${{ secrets.HEDERA_OPERATOR_ID }}
      HEDERA_OPERATOR_KEY: ${{ secrets.HEDERA_OPERATOR_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: What to create
        id: what
        run: |
          tasks=" $(sed 's/#.*//' .github/deploy/hedera.request | tr -s ' \n\t' ' ' | xargs) "
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          echo "Creating:$tasks"
      - name: Check the operator account
        run: |
          curl -sf "https://testnet.mirrornode.hedera.com/api/v1/accounts/${HEDERA_OPERATOR_ID}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);console.log(`account ${a.account} · ${(Number(a.balance.balance)/1e8).toFixed(2)} HBAR · key ${a.key?._type}`);if(a.key?._type!=="ECDSA_SECP256K1"){console.error("The operator key must be ECDSA (secp256k1)");process.exit(1)}})'
      - name: Ledger topic
        if: contains(steps.what.outputs.tasks, ' topic ')
        run: pnpm --filter @ordo/contracts setup:hedera topic | tee -a setup.log
      - name: Contracts
        if: contains(steps.what.outputs.tasks, ' contracts ')
        env:
          TRUST_CONTRACT_ADDRESS: "0x608cba52976e34fa160fe64ff0499a8a5a4eb9e1"
          TRUST_RPC_URL: https://testnet.hashio.io/api
          TRUST_CHAIN_ID: "296"
        run: pnpm --filter @ordo/contracts setup:hedera contracts | tee -a setup.log
      - name: Lot passport collection
        if: contains(steps.what.outputs.tasks, ' passport ')
        run: pnpm --filter @ordo/contracts setup:hedera passport | tee -a setup.log
      - name: Agent account
        if: contains(steps.what.outputs.tasks, ' agent ')
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_ua7E01jdI0VpLBJvZyqqulOlBzGP
          VERCEL_ORG_ID: team_8ghjcEpH2t9p2BktkDNQ9ZXm
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::The agent's key goes straight to Vercel: add VERCEL_TOKEN as a repository secret first"; exit 1; fi
          umask 077
          SECRET_OUT="$RUNNER_TEMP/agent.env" pnpm --filter @ordo/contracts setup:hedera agent | tee -a setup.log
          node scripts/vercel-env.mjs push "$RUNNER_TEMP/agent.env" production,preview
          rm -f "$RUNNER_TEMP/agent.env"
      - name: Ordo USD (Stablecoin Studio)
        if: contains(steps.what.outputs.tasks, ' stablecoin ')
        env:
          STABLECOIN_FACTORY_ID: ${{ vars.STABLECOIN_FACTORY_ID }}
        run: |
          npm install --prefix tools/stablecoin --no-audit --no-fund --loglevel=error
          node tools/stablecoin/create.cjs | tee stablecoin.log | tee -a setup.log
          grep -E '^STABLECOIN_(ADDRESS|TOKEN_ADDRESS)=' stablecoin.log >> "$GITHUB_ENV"
      - name: OrdoPayOnProof
        if: contains(steps.what.outputs.tasks, ' payonproof ')
        env:
          TRUST_CONTRACT_ADDRESS: ${{ vars.TRUST_CONTRACT_ADDRESS || '0x608cba52976e34fa160fe64ff0499a8a5a4eb9e1' }}
          TRUST_RPC_URL: https://testnet.hashio.io/api
          TRUST_CHAIN_ID: "296"
          VAR_STABLECOIN_ADDRESS: ${{ vars.STABLECOIN_ADDRESS }}
          VAR_STABLECOIN_TOKEN_ADDRESS: ${{ vars.STABLECOIN_TOKEN_ADDRESS }}
        run: |
          export STABLECOIN_ADDRESS="${STABLECOIN_ADDRESS:-$VAR_STABLECOIN_ADDRESS}" STABLECOIN_TOKEN_ADDRESS="${STABLECOIN_TOKEN_ADDRESS:-$VAR_STABLECOIN_TOKEN_ADDRESS}"
          pnpm --filter @ordo/contracts setup:hedera payonproof | tee -a setup.log
      - name: Set the values in Vercel
        if: contains(steps.what.outputs.tasks, ' stablecoin ') || contains(steps.what.outputs.tasks, ' payonproof ')
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_ua7E01jdI0VpLBJvZyqqulOlBzGP
          VERCEL_ORG_ID: team_8ghjcEpH2t9p2BktkDNQ9ZXm
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::warning::No VERCEL_TOKEN: set the values above in Vercel by hand"; exit 0; fi
          grep -E '^(STABLECOIN_ADDRESS|STABLECOIN_TOKEN_ADDRESS|PAY_ON_PROOF_ADDRESS)=' setup.log > "$RUNNER_TEMP/pop.env" || true
          [ -s "$RUNNER_TEMP/pop.env" ] && node scripts/vercel-env.mjs push "$RUNNER_TEMP/pop.env" production,preview
          rm -f "$RUNNER_TEMP/pop.env"
      - name: Summary
        if: always()
        run: |
          echo '### Hedera setup' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          [ -f setup.log ] && cat setup.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
