name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ordo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Server tests (domain, API, serverless behaviour, ledger, LLM guard)
        run: pnpm --filter @ordo/server test
      - name: Contract tests (in-process EVM)
        run: pnpm --filter @ordo/contracts test
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end console (single container, injected test wallet)
        run: pnpm e2e
      - name: Build for Vercel (Build Output API)
        run: pnpm vercel-build
      - name: End-to-end console (Vercel build, real Postgres, no background timer)
        run: pnpm e2e
        env:
          E2E_TARGET: vercel
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ordo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
