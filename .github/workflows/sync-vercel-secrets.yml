name: Sync secrets to Vercel

# Copies GitHub environment secrets into the Vercel project, as listed (by name only) in
# .github/vercel-secrets.map. To add one: create the secret in its GitHub environment, add a line to
# the map, push. Runs on every change to the map, or by hand once this file is on the default branch.
# Needs VERCEL_TOKEN (vercel.com/account/tokens) as a repository secret or in each environment.
# Only names are logged; redeploy afterwards for the new values to apply.
on:
  push:
    paths: [".github/vercel-secrets.map"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environments:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "list=$(sed 's/#.*//' .github/vercel-secrets.map | awk 'NF>=3{print $1}' | sort -u | jq -Rcs 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  sync:
    needs: environments
    if: needs.environments.outputs.list != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.environments.outputs.list) }}
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy ${{ matrix.environment }} secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_ua7E01jdI0VpLBJvZyqqulOlBzGP
          VERCEL_ORG_ID: team_8ghjcEpH2t9p2BktkDNQ9ZXm
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::Add VERCEL_TOKEN as a repository secret (or to the ${{ matrix.environment }} environment)"; exit 1; fi
          node scripts/vercel-env.mjs sync .github/vercel-secrets.map "${{ matrix.environment }}"
