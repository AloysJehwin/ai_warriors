name: Deploy OrdoTrust

# Deploys contracts/src/OrdoTrust.sol to Hedera testnet with the operator key held in the
# `hedera-testnet` environment. Runs when .github/deploy/trust.request changes (so it works from
# any branch) or by hand once this file is on the default branch. Then deploys the contracts bound to it (OrdoWorkOrders,
# OrdoPolicies, OrdoPayOnProof) and writes all four addresses to Vercel. The log prints only public values.
on:
  push:
    paths: [".github/deploy/trust.request"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hedera-testnet
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the operator account
        env:
          HEDERA_OPERATOR_ID: ${{ secrets.HEDERA_OPERATOR_ID }}
        run: |
          curl -sf "https://testnet.mirrornode.hedera.com/api/v1/accounts/${HEDERA_OPERATOR_ID}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);console.log(`account ${a.account} · evm ${a.evm_address} · ${(Number(a.balance.balance)/1e8).toFixed(2)} HBAR · key ${a.key?._type}`);if(a.key?._type!=="ECDSA_SECP256K1"){console.error("The operator key must be ECDSA (secp256k1)");process.exit(1)}})'
      - name: Deploy OrdoTrust
        env:
          HEDERA_OPERATOR_KEY: ${{ secrets.HEDERA_OPERATOR_KEY }}
          TRUST_RPC_URL: https://testnet.hashio.io/api
          TRUST_CHAIN_ID: "296"
          MIN_STAKE: "10"
          UNSTAKE_COOLDOWN_SECONDS: "604800"
        run: pnpm --filter @ordo/contracts deploy:trust | tee deploy.log
      - name: Contracts bound to OrdoTrust
        # OrdoWorkOrders, OrdoPolicies and OrdoPayOnProof read OrdoTrust at an address fixed when they were deployed
        env:
          HEDERA_OPERATOR_ID: ${{ secrets.HEDERA_OPERATOR_ID }}
          HEDERA_OPERATOR_KEY: ${{ secrets.HEDERA_OPERATOR_KEY }}
          TRUST_RPC_URL: https://testnet.hashio.io/api
          TRUST_CHAIN_ID: "296"
          STABLECOIN_ADDRESS: ${{ vars.STABLECOIN_ADDRESS || '0xacb80acbc65d73f4b544e2324fa2f5dcc38c8594' }}
          STABLECOIN_TOKEN_ADDRESS: ${{ vars.STABLECOIN_TOKEN_ADDRESS }}
        run: |
          export TRUST_CONTRACT_ADDRESS="$(grep -oE '^TRUST_CONTRACT_ADDRESS=0x[0-9a-fA-F]{40}' deploy.log | cut -d= -f2)"
          [ -n "$TRUST_CONTRACT_ADDRESS" ] || { echo "::error::No OrdoTrust address in the deploy log"; exit 1; }
          pnpm --filter @ordo/contracts setup:hedera contracts | tee -a deploy.log
          pnpm --filter @ordo/contracts setup:hedera payonproof | tee -a deploy.log
      - name: Set the addresses in Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_ua7E01jdI0VpLBJvZyqqulOlBzGP
          VERCEL_ORG_ID: team_8ghjcEpH2t9p2BktkDNQ9ZXm
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::warning::No VERCEL_TOKEN: set the values above in Vercel by hand"; exit 0; fi
          grep -E '^(TRUST_CONTRACT_ADDRESS|TRUST_WORKORDERS_ADDRESS|TRUST_POLICIES_ADDRESS|PAY_ON_PROOF_ADDRESS)=0x' deploy.log > "$RUNNER_TEMP/trust.env"
          cat "$RUNNER_TEMP/trust.env"
          node scripts/vercel-env.mjs push "$RUNNER_TEMP/trust.env" production,preview
      - name: Summary
        run: |
          echo '### OrdoTrust on Hedera testnet' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -v RELAYER deploy.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
